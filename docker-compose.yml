services:
  # PostgreSQL Container
  db:
    image: postgres:15-alpine
    container_name: trade_db_container
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: trade_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d trade_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - project

  # Auth Service (gRPC)
  auth:
    build: 
      context: ./auth_service
      dockerfile: Dockerfile
    container_name: trade_auth_container
    ports:
      - "50051:50051"  # gRPC port
    environment:
      - DATABASE_URL=postgres://user:pass@db:5432/trade_db?sslmode=disable
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - GRPC_PORT=50051
    depends_on:
      db:
        condition: service_healthy
    networks:
      - project
    restart: unless-stopped

  # Main Backend (HTTP + gRPC client)
  app:
    build: ./backend
    container_name: trade_app_container
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://user:pass@db:5432/trade_db?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - AUTH_SERVICE_ADDR=auth:50051  # auth сервиса из docker-compose
      - JWT_SECRET=${JWT_ACCESS_SECRET}
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
      redis:              
        condition: service_healthy
    networks:
      - project
    restart: unless-stopped
  
  # Frontend (React)
  frontend:
    build: ./frontend
    container_name: trade_frontend_container
    ports: 
      - "5173:5173"
    environment:
      # Vite проксирует /api на бэкенд, поэтому браузер ходит на тот же origin и cookie работают
      - API_PROXY_TARGET=http://app:8080
    depends_on:
      - app
    networks:
      - project
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    container_name: trade_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - project
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  project:
    driver: bridge

volumes:
  pgdata:
  redis_data:
    driver: local