services:
  db:
    image: postgres:15-alpine
    container_name: trade_db_container
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: trade_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d trade_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: trade_app_container
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://user:pass@db:5432/trade_db?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: