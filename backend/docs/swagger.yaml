basePath: /api/v1
definitions:
  models.ChangePasswordRequest:
    properties:
      currentPassword:
        type: string
      newPassword:
        minLength: 6
        type: string
    required:
    - currentPassword
    - newPassword
    type: object
  models.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  models.RegisterRequest:
    properties:
      email:
        type: string
      firstName:
        type: string
      lastName:
        type: string
      password:
        minLength: 6
        type: string
      socialLink:
        type: string
      username:
        type: string
    required:
    - email
    - password
    - username
    type: object
  models.ResponseApi:
    properties:
      code:
        description: '[!] доработать код ошибки [!]'
        type: string
      error:
        type: string
      message:
        example: Information message
        type: string
      request_id:
        example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        type: string
      result: {}
      status:
        example: true
        type: boolean
    type: object
  models.SkillFull:
    properties:
      category:
        type: string
      created_at:
        type: string
      description:
        type: string
      exchange:
        type: string
      id:
        type: integer
      media:
        type: string
      skill:
        type: string
      username:
        type: string
    type: object
  models.UpdateProfileRequest:
    properties:
      email:
        type: string
      firstName:
        type: string
      lastName:
        type: string
      socialLink:
        type: string
      username:
        type: string
    type: object
  models.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      firstName:
        type: string
      id:
        type: string
      lastName:
        type: string
      password:
        description: omitempty чтобы не светить в API
        type: string
      socialLink:
        type: string
      username:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Trade Your Exp.
  title: Swagger Example API
  version: "1.0"
paths:
  /login:
    post:
      consumes:
      - application/json
      description: Авторизирует пользователя по введенным данным.
      parameters:
      - description: Данные для входа (в username можно передать email)
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/models.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Пользователь успешно вошел
          schema:
            $ref: '#/definitions/models.ResponseApi'
        "400":
          description: Неверный формат данных
          schema:
            $ref: '#/definitions/models.ResponseApi'
        "401":
          description: Неверные учетные данные
          schema:
            $ref: '#/definitions/models.ResponseApi'
      summary: Авторизация пользователя
      tags:
      - users
  /logout:
    post:
      description: Отзывает access-токен в auth-service и удаляет cookie с токенами.
      produces:
      - application/json
      responses:
        "200":
          description: Пользователь успешно вышел
          schema:
            $ref: '#/definitions/models.ResponseApi'
        "500":
          description: Ошибка auth-service
          schema:
            $ref: '#/definitions/models.ResponseApi'
      summary: Выход пользователя
      tags:
      - users
  /refresh:
    post:
      description: Выдает новую пару токенов по refresh-токену из cookie.
      produces:
      - application/json
      responses:
        "200":
          description: Токены успешно обновлены
          schema:
            $ref: '#/definitions/models.ResponseApi'
        "401":
          description: Refresh-токен отсутствует или недействителен
          schema:
            $ref: '#/definitions/models.ResponseApi'
      summary: Обновление токенов
      tags:
      - users
  /register:
    post:
      consumes:
      - application/json
      description: Создание пользователя с заполнением требуемых полей.
      parameters:
      - description: Данные пользователя
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/models.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Пользователь успешно создан
          schema:
            $ref: '#/definitions/models.ResponseApi'
        "400":
          description: Неверный формат данных
          schema:
            $ref: '#/definitions/models.ResponseApi'
        "409":
          description: Пользователь уже существует
          schema:
            $ref: '#/definitions/models.ResponseApi'
      summary: Создание пользователя
      tags:
      - users
  /skills:
    get:
      consumes:
      - application/json
      description: Вывод полного списка навыков.
      produces:
      - application/json
      responses:
        "200":
          description: Вывод пользовательских скиллов
          schema:
            $ref: '#/definitions/models.ResponseApi'
        "400":
          description: Неверный формат
          schema:
            $ref: '#/definitions/models.ResponseApi'
        "404":
          description: Пользователь не найден
          schema:
            $ref: '#/definitions/models.ResponseApi'
      summary: Вывести все скиллы
      tags:
      - skills
  /skills/{category}:
    get:
      consumes:
      - application/json
      description: Вывод полного списка скиллов по категории.
      parameters:
      - description: Категория скилла
        in: path
        name: category
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Вывод пользовательских скиллов
          schema:
            $ref: '#/definitions/models.ResponseApi'
        "400":
          description: Неверный формат
          schema:
            $ref: '#/definitions/models.ResponseApi'
        "404":
          description: Категория не найдена
          schema:
            $ref: '#/definitions/models.ResponseApi'
      summary: Вывести все скиллы по категории.
      tags:
      - skills
  /skills/{id}:
    delete:
      consumes:
      - application/json
      description: Удаляет запрос навыка по его ID
      parameters:
      - description: ID запроса
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Запрос навыка успешно удален
          schema:
            $ref: '#/definitions/models.ResponseApi'
        "404":
          description: Неверный формат ID
          schema:
            $ref: '#/definitions/models.ResponseApi'
        "500":
          description: Запрос не найден
          schema:
            $ref: '#/definitions/models.ResponseApi'
      summary: Удалить запрос
      tags:
      - skills
  /skills/desc:
    get:
      consumes:
      - application/json
      description: Вывод полного дополнительных описаний
      produces:
      - application/json
      responses:
        "200":
          description: Вывод списка доп. описаний
          schema:
            $ref: '#/definitions/models.ResponseApi'
        "400":
          description: Неверный формат
          schema:
            $ref: '#/definitions/models.ResponseApi'
        "404":
          description: Пользователь не найден
          schema:
            $ref: '#/definitions/models.ResponseApi'
      summary: Вывести все доп.описания
      tags:
      - skills
  /skills/desc/{id}:
    get:
      consumes:
      - application/json
      description: Выводит описание по персональному skill_id
      parameters:
      - description: Вывод описания по skill_id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Вывод пользователя
          schema:
            $ref: '#/definitions/models.ResponseApi'
        "400":
          description: Неверный формат Skill ID
          schema:
            $ref: '#/definitions/models.ResponseApi'
        "404":
          description: Пользователь не найден
          schema:
            $ref: '#/definitions/models.ResponseApi'
      summary: Вывод описания по skill_id
      tags:
      - skills
  /skills/filter/{search}:
    get:
      consumes:
      - application/json
      description: Вывод полного списка скиллов по переданной строке.
      parameters:
      - description: Ключевая строка поиска
        in: path
        name: search
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Вывод пользовательских скиллов
          schema:
            $ref: '#/definitions/models.ResponseApi'
        "400":
          description: Неверный формат
          schema:
            $ref: '#/definitions/models.ResponseApi'
        "404":
          description: Категория не найдена
          schema:
            $ref: '#/definitions/models.ResponseApi'
      summary: Вывести все скиллы по вхождению в ключевую строку.
      tags:
      - skills
  /skills/with-desc:
    post:
      consumes:
      - application/json
      description: Создание нового запроса с описанием
      parameters:
      - description: Данные запроса навыка
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/models.SkillFull'
      produces:
      - application/json
      responses:
        "201":
          description: Запрос навыка успешно создан
          schema:
            $ref: '#/definitions/models.ResponseApi'
        "400":
          description: Неверный формат запроса
          schema:
            $ref: '#/definitions/models.ResponseApi'
        "409":
          description: Конфликт при создании запроса
          schema:
            $ref: '#/definitions/models.ResponseApi'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/models.ResponseApi'
      summary: Добавление запроса с дополнительным описанием
      tags:
      - skills
  /users/{id}:
    delete:
      consumes:
      - application/json
      description: Удаляет пользователя из базы данных по его UUID.
      parameters:
      - description: UUID пользователя
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Пользователь успешно удален
          schema:
            $ref: '#/definitions/models.ResponseApi'
        "404":
          description: Неверный формат ID
          schema:
            $ref: '#/definitions/models.ResponseApi'
        "500":
          description: Пользователь не найден
          schema:
            $ref: '#/definitions/models.ResponseApi'
      summary: Удалить пользователя
      tags:
      - users
    put:
      consumes:
      - application/json
      description: Обновляет данные в базе данных по его UUID.
      parameters:
      - description: ID пользователя
        in: path
        name: id
        required: true
        type: string
      - description: Новые данные
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/models.User'
      produces:
      - application/json
      responses:
        "201":
          description: Пользователь успешно обновлен
        "400":
          description: Неверный формат ID
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Пользователь не найден
          schema:
            additionalProperties: true
            type: object
      summary: Обновить данные
      tags:
      - users
  /users/me:
    get:
      consumes:
      - application/json
      description: Вывод полного профиля.
      produces:
      - application/json
      responses:
        "200":
          description: Вывод профиля
          schema:
            $ref: '#/definitions/models.ResponseApi'
        "400":
          description: Неверный формат
          schema:
            $ref: '#/definitions/models.ResponseApi'
        "404":
          description: Пользователь не найден
          schema:
            $ref: '#/definitions/models.ResponseApi'
      summary: Вывести собственный профиль
      tags:
      - users
    put:
      consumes:
      - application/json
      description: Обновляет только переданные непустые поля профиля.
      parameters:
      - description: Новые данные профиля
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/models.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Профиль успешно обновлен
          schema:
            $ref: '#/definitions/models.ResponseApi'
        "400":
          description: Неверный формат данных
          schema:
            $ref: '#/definitions/models.ResponseApi'
        "409":
          description: Username уже занят
          schema:
            $ref: '#/definitions/models.ResponseApi'
      summary: Обновить собственный профиль
      tags:
      - users
  /users/me/password:
    put:
      consumes:
      - application/json
      description: Проверяет текущий пароль и сохраняет новый.
      parameters:
      - description: Текущий и новый пароль
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/models.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Пароль успешно изменен
          schema:
            $ref: '#/definitions/models.ResponseApi'
        "400":
          description: Неверный формат данных или текущий пароль
          schema:
            $ref: '#/definitions/models.ResponseApi'
      summary: Сменить пароль
      tags:
      - users
  /users/me/static:
    get:
      consumes:
      - application/json
      description: Вывод полной статистики.
      produces:
      - application/json
      responses:
        "200":
          description: Вывод статистики
          schema:
            $ref: '#/definitions/models.ResponseApi'
        "400":
          description: Неверный формат
          schema:
            $ref: '#/definitions/models.ResponseApi'
        "404":
          description: Пользователь не найден
          schema:
            $ref: '#/definitions/models.ResponseApi'
      summary: Вывести собственный статистики
      tags:
      - users
  /users/profile/{username}:
    get:
      consumes:
      - application/json
      description: Вывод полного профиля пользователя.
      parameters:
      - description: Имя (UserName) пользователя
        in: path
        name: username
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Вывод профиля пользователя
          schema:
            $ref: '#/definitions/models.ResponseApi'
        "400":
          description: Неверный формат
          schema:
            $ref: '#/definitions/models.ResponseApi'
        "404":
          description: Пользователь не найден
          schema:
            $ref: '#/definitions/models.ResponseApi'
      summary: Вывести сторонний профиль
      tags:
      - users
schemes:
- http
- https
swagger: "2.0"
