basePath: /api/v1
definitions:
  models.AuthLoginRequest:
    properties:
      login:
        type: string
      password:
        type: string
      type:
        enum:
        - email
        - username
        type: string
    required:
    - login
    - password
    type: object
  models.AuthRegisterRequest:
    properties:
      email:
        type: string
      firstName:
        type: string
      lastName:
        type: string
      link:
        type: string
      password:
        minLength: 6
        type: string
      username:
        type: string
    required:
    - email
    - password
    - username
    type: object
  models.ChangePasswordRequest:
    properties:
      currentPassword:
        type: string
      newPassword:
        minLength: 6
        type: string
    required:
    - currentPassword
    - newPassword
    type: object
  models.Profile:
    properties:
      createdAt:
        type: string
      email:
        type: string
      firstName:
        type: string
      id:
        type: string
      lastName:
        type: string
      link:
        type: string
      username:
        type: string
    type: object
  models.ProfileUpdate:
    properties:
      email:
        type: string
      firstName:
        type: string
      lastName:
        type: string
      link:
        type: string
      username:
        type: string
    type: object
  models.ResponseApi:
    properties:
      code:
        description: '[!] доработать код ошибки [!]'
        type: string
      error:
        type: string
      message:
        example: Information message
        type: string
      request_id:
        example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        type: string
      result: {}
      status:
        example: true
        type: boolean
    type: object
  models.SkillCard:
    properties:
      avatarUsername:
        type: string
      category:
        type: string
      contactType:
        type: string
      contactValue:
        type: string
      createdAt:
        type: string
      description:
        type: string
      exchange:
        type: string
      id:
        example: "0"
        type: string
      skill:
        type: string
      status:
        type: string
      username:
        type: string
    type: object
  models.SkillCreateRequest:
    properties:
      category:
        type: string
      contactType:
        enum:
        - site
        - telegram
        - vk
        - wechat
        type: string
      contactValue:
        type: string
      description:
        type: string
      exchange:
        type: string
      skill:
        type: string
    required:
    - category
    - exchange
    - skill
    type: object
  models.SkillStats:
    properties:
      active:
        type: integer
      byMonth:
        items:
          $ref: '#/definitions/models.SkillStatsMonth'
        type: array
      closed:
        type: integer
      total:
        type: integer
    type: object
  models.SkillStatsMonth:
    properties:
      count:
        type: integer
      month:
        type: string
    type: object
  models.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      firstName:
        type: string
      id:
        type: string
      lastName:
        type: string
      password:
        description: omitempty чтобы не светить в API
        type: string
      socialLink:
        type: string
      username:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Trade Your Exp.
  title: Trade Your Exp API
  version: "1.0"
paths:
  /auth/changepassword:
    post:
      consumes:
      - application/json
      parameters:
      - description: Текущий и новый пароль
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/models.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ResponseApi'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ResponseApi'
      summary: Смена пароля
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Логин (никнейм или email) и пароль
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/models.AuthLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.ResponseApi'
            - properties:
                result:
                  $ref: '#/definitions/models.Profile'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ResponseApi'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ResponseApi'
      summary: Вход
      tags:
      - auth
  /auth/logout:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ResponseApi'
      summary: Выход
      tags:
      - auth
  /auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.ResponseApi'
            - properties:
                result:
                  $ref: '#/definitions/models.Profile'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ResponseApi'
      summary: Мой профиль
      tags:
      - auth
  /auth/profile/{username}:
    get:
      parameters:
      - description: Никнейм
        in: path
        name: username
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.ResponseApi'
            - properties:
                result:
                  $ref: '#/definitions/models.Profile'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ResponseApi'
      summary: Профиль пользователя
      tags:
      - auth
  /auth/refresh:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ResponseApi'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ResponseApi'
      summary: Обновление токенов
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Данные пользователя
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/models.AuthRegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/models.ResponseApi'
            - properties:
                result:
                  $ref: '#/definitions/models.Profile'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ResponseApi'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/models.ResponseApi'
      summary: Регистрация
      tags:
      - auth
  /auth/update:
    put:
      consumes:
      - application/json
      parameters:
      - description: Изменяемые поля
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/models.ProfileUpdate'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.ResponseApi'
            - properties:
                result:
                  $ref: '#/definitions/models.Profile'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ResponseApi'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/models.ResponseApi'
      summary: Редактирование профиля
      tags:
      - auth
  /skills:
    get:
      parameters:
      - description: Код категории (it, communicate, art, knowledge, hobby)
        in: query
        name: category
        type: string
      - description: Строка поиска
        in: query
        name: search
        type: string
      - description: 'Где искать: skill — предлагаемый навык, exchange — желаемый;
          пусто — везде'
        in: query
        name: searchIn
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.ResponseApi'
            - properties:
                result:
                  items:
                    $ref: '#/definitions/models.SkillCard'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ResponseApi'
      summary: Лента обменов
      tags:
      - skills
    post:
      consumes:
      - application/json
      parameters:
      - description: Данные обмена
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/models.SkillCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.ResponseApi'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ResponseApi'
      summary: Создать обмен
      tags:
      - skills
  /skills/{category}:
    get:
      parameters:
      - description: Код категории
        in: path
        name: category
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.ResponseApi'
            - properties:
                result:
                  items:
                    $ref: '#/definitions/models.SkillCard'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ResponseApi'
      summary: Обмены по категории
      tags:
      - skills
  /skills/{id}:
    delete:
      parameters:
      - description: ID обмена
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ResponseApi'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ResponseApi'
      summary: Удалить обмен
      tags:
      - skills
  /skills/desc:
    get:
      consumes:
      - application/json
      description: Вывод полного дополнительных описаний
      produces:
      - application/json
      responses:
        "200":
          description: Вывод списка доп. описаний
          schema:
            $ref: '#/definitions/models.ResponseApi'
        "400":
          description: Неверный формат
          schema:
            $ref: '#/definitions/models.ResponseApi'
        "404":
          description: Пользователь не найден
          schema:
            $ref: '#/definitions/models.ResponseApi'
      summary: Вывести все доп.описания
      tags:
      - skills
  /skills/desc/{id}:
    get:
      consumes:
      - application/json
      description: Выводит описание по персональному skill_id
      parameters:
      - description: Вывод описания по skill_id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Вывод пользователя
          schema:
            $ref: '#/definitions/models.ResponseApi'
        "400":
          description: Неверный формат Skill ID
          schema:
            $ref: '#/definitions/models.ResponseApi'
        "404":
          description: Пользователь не найден
          schema:
            $ref: '#/definitions/models.ResponseApi'
      summary: Вывод описания по skill_id
      tags:
      - skills
  /skills/filter/{search}:
    get:
      parameters:
      - description: Строка поиска
        in: path
        name: search
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.ResponseApi'
            - properties:
                result:
                  items:
                    $ref: '#/definitions/models.SkillCard'
                  type: array
              type: object
      summary: Поиск обменов
      tags:
      - skills
  /skills/my:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.ResponseApi'
            - properties:
                result:
                  items:
                    $ref: '#/definitions/models.SkillCard'
                  type: array
              type: object
      summary: Мои обмены
      tags:
      - skills
  /skills/my/stats:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.ResponseApi'
            - properties:
                result:
                  $ref: '#/definitions/models.SkillStats'
              type: object
      summary: Моя статистика
      tags:
      - skills
  /users/{id}:
    delete:
      consumes:
      - application/json
      description: Удаляет пользователя из базы данных по его UUID.
      parameters:
      - description: UUID пользователя
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Пользователь успешно удален
          schema:
            $ref: '#/definitions/models.ResponseApi'
        "404":
          description: Неверный формат ID
          schema:
            $ref: '#/definitions/models.ResponseApi'
        "500":
          description: Пользователь не найден
          schema:
            $ref: '#/definitions/models.ResponseApi'
      summary: Удалить пользователя
      tags:
      - users
    put:
      consumes:
      - application/json
      description: Обновляет данные в базе данных по его UUID.
      parameters:
      - description: ID пользователя
        in: path
        name: id
        required: true
        type: string
      - description: Новые данные
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/models.User'
      produces:
      - application/json
      responses:
        "201":
          description: Пользователь успешно обновлен
        "400":
          description: Неверный формат ID
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Пользователь не найден
          schema:
            additionalProperties: true
            type: object
      summary: Обновить данные
      tags:
      - users
schemes:
- http
- https
swagger: "2.0"
